databases:
  - name: supermarket-db
    plan: free

services:
  - type: web
    name: supermarket-api
    runtime: docker
    repo: https://github.com/weimei-1/222.git
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/auth/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://<数据库主机>:5432/<数据库名>
      - key: SPRING_DATASOURCE_USERNAME
        value: <数据库用户名>
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: JWT_SECRET
        generateValue: true

  - type: web
    runtime: static
    name: supermarket-frontend
    repo: https://github.com/weimei-1/222.git
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://supermarket-api.onrender.com
