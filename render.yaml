services:

  # ==================== 后端 API 服务 ====================
  - type: web
    name: supermarket-api
    runtime: docker
    repo: https://github.com/你的用户名/仓库名
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/auth/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://<数据库主机>:3306/supermarket_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - key: SPRING_DATASOURCE_USERNAME
        value: <数据库用户名>
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: JWT_SECRET
        generateValue: true

  # ==================== 前端静态站点 ====================
  - type: static
    name: supermarket-frontend
    repo: https://github.com/你的用户名/仓库名
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: /dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://supermarket-api.onrender.com
